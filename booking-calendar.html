<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Booking Calendar Widget</title>
  <style>
    /* ══════════════════════════════════════════
       DESIGN SYSTEM TOKENS (Nevari)
    ══════════════════════════════════════════ */
    :root {
      --color-bg-page:        #EDE5DA;
      --color-bg-app:         #F8F5EF;
      --color-bg-panel:       #FFFFFF;

      --color-primary:        #0E2955;
      --color-primary-hover:  #143B73;
      --color-primary-soft:   #E7EEF8;

      --color-text-main:      #0E2955;
      --color-text-muted:     #5F6470;
      --color-text-subtle:    #9AA4B5;

      --color-border:         rgba(14,41,85,0.10);
      --color-border-strong:  rgba(14,41,85,0.18);

      --color-accent-lime:    #D8CAB6;
      --color-accent-mint:    #ADB7C8;
      --color-accent-rose:    #D99860;
      --color-accent-violet:  #5C6D89;
      --color-accent-teal:    #344A6E;
      --color-accent-apricot: #B9996D;

      /* semantic availability — built from brand palette */
      --color-avail-bg:       rgba(212,237,226,0.50);
      --color-avail-border:   rgba(158,207,184,0.55);
      --color-avail-dot:      #349A6E;

      --color-partial-bg:     rgba(254,240,204,0.54);
      --color-partial-border: rgba(240,208,128,0.55);
      --color-partial-dot:    #D99860;   /* accent-rose */

      --color-full-bg:        rgba(173,183,200,0.22);  /* accent-mint tint */
      --color-full-border:    rgba(173,183,200,0.40);
      --color-full-dot:       #ADB7C8;   /* accent-mint */

      --font-family-base: Inter, Manrope, ui-sans-serif, system-ui, sans-serif;

      --radius-xs:   8px;
      --radius-sm:   12px;
      --radius-md:   16px;
      --radius-lg:   22px;
      --radius-xl:   30px;
      --radius-pill: 999px;

      --shadow-soft:  0 18px 45px rgba(14,41,85,0.10);
      --shadow-card:  0 12px 28px rgba(14,41,85,0.07);
      --shadow-inset: inset 0 1px 0 rgba(255,255,255,0.55);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-family-base);
      color: var(--color-text-main);
      background:
        radial-gradient(circle at 25% 20%, rgba(255,255,255,0.58), transparent 34%),
        radial-gradient(circle at 78% 15%, rgba(216,202,182,0.34), transparent 28%),
        var(--color-bg-page);
      min-height: 100vh;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    /* ══════════════════════════════════════════
       WIDGET SHELL
    ══════════════════════════════════════════ */
    .booking-widget {
      width: 100%;
      max-width: 820px;
      background: rgba(248,245,239,0.96);
      border: 1px solid rgba(255,255,255,0.60);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-soft);
      overflow: hidden;
      backdrop-filter: blur(18px);
    }

    /* ══════════════════════════════════════════
       STEP INDICATOR HEADER
    ══════════════════════════════════════════ */
    .steps-header {
      padding: 22px 26px 0;
      border-bottom: 1px solid var(--color-border);
      background: linear-gradient(180deg,rgba(255,255,255,0.28),transparent);
    }

    .title-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .widget-title    { font-size: 22px; font-weight: 700; letter-spacing: -0.04em; line-height: 1.1; }
    .widget-subtitle { font-size: 12px; color: var(--color-text-muted); margin-top: 3px; }

    /* legend */
    .legend { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .legend-item {
      display: flex; align-items: center; gap: 5px;
      font-size: 11px; font-weight: 600; color: var(--color-text-muted);
    }
    .legend-dot { width: 7px; height: 7px; border-radius: 50%; }
    .legend-dot.avail   { background: var(--color-avail-dot); }
    .legend-dot.partial { background: var(--color-partial-dot); }
    .legend-dot.full    { background: var(--color-full-dot); }

    /* step track */
    .steps-track {
      display: flex;
      align-items: stretch;
      position: relative;
    }
    .step-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }
    /* connector line */
    .step-item:not(:last-child)::after {
      content: '';
      position: absolute;
      top: 16px;
      left: calc(50% + 19px);
      right: calc(-50% + 19px);
      height: 2px;
      background: var(--color-border);
      z-index: 0;
      transition: background 0.4s;
    }
    .step-item.done:not(:last-child)::after { background: var(--color-primary); }

    .step-circle {
      width: 32px; height: 32px; border-radius: 50%;
      background: rgba(255,255,255,0.55);
      border: 2px solid var(--color-border);
      display: grid; place-items: center;
      font-size: 12px; font-weight: 700;
      position: relative; z-index: 1;
      color: var(--color-text-subtle);
      transition: background 0.3s, border-color 0.3s, color 0.3s, box-shadow 0.3s;
    }
    .step-item.active .step-circle {
      background: var(--color-primary);
      border-color: var(--color-primary);
      color: white;
      box-shadow: 0 8px 20px rgba(14,41,85,0.22);
    }
    .step-item.done .step-circle {
      background: var(--color-primary);
      border-color: var(--color-primary);
      color: white;
    }
    /* checkmark on done — JS swaps inner text */

    .step-label {
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.06em; color: var(--color-text-subtle);
      margin-top: 7px; margin-bottom: 12px; text-align: center;
      white-space: nowrap; transition: color 0.3s;
    }
    .step-item.active .step-label { color: var(--color-primary); }
    .step-item.done   .step-label { color: var(--color-text-muted); }
    .step-item.done   { cursor: pointer; }
    .step-item.done:hover .step-circle { background: var(--color-primary-hover); }

    /* ══════════════════════════════════════════
       STEP PANELS
    ══════════════════════════════════════════ */
    .step-panels { position: relative; }

    .step-panel {
      display: none;
      padding: 24px 26px 28px;
      animation: fadeUp 0.26s ease;
    }
    .step-panel.active { display: block; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .panel-head {
      display: flex; align-items: flex-start;
      justify-content: space-between; gap: 12px;
      margin-bottom: 20px; flex-wrap: wrap;
    }
    .panel-heading { font-size: 16px; font-weight: 700; letter-spacing: -0.03em; }
    .panel-sub     { font-size: 11px; color: var(--color-text-muted); margin-top: 3px; }

    /* ══ STEP 1 — CALENDAR ══ */
    .month-row {
      display: flex; align-items: center;
      justify-content: space-between; gap: 10px; margin-bottom: 12px;
    }
    .month-label { font-size: 16px; font-weight: 700; letter-spacing: -0.04em; }
    .month-controls { display: flex; align-items: center; gap: 8px; }

    /* calendar-nav — from design system .calendar-nav */
    .calendar-nav {
      width: 38px; height: 38px; border-radius: 50%;
      background: rgba(255,255,255,0.55);
      border: 1px solid var(--color-border);
      display: grid; place-items: center; font-size: 16px; cursor: pointer;
      box-shadow: var(--shadow-inset); color: var(--color-text-main);
      transition: background 0.15s, transform 0.12s;
    }
    .calendar-nav:hover { background: rgba(255,255,255,0.88); transform: scale(1.05); }

    /* today pill — from design system .pill */
    .pill-btn {
      min-height: 34px; display: inline-flex; align-items: center;
      gap: 8px; padding: 0 14px; border-radius: var(--radius-pill);
      background: rgba(255,255,255,0.38); border: 1px solid var(--color-border);
      color: var(--color-text-main); font-size: 12px; font-weight: 600;
      box-shadow: var(--shadow-inset); cursor: pointer;
      transition: background 0.15s;
    }
    .pill-btn:hover { background: rgba(255,255,255,0.72); }

    .day-names { display: grid; grid-template-columns: repeat(7,1fr); gap: 6px; margin-bottom: 8px; }
    /* from design system .calendar-day-name */
    .day-name {
      text-align: center; font-size: 11px; font-weight: 700;
      color: var(--color-text-muted); padding-bottom: 8px;
    }

    .cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 6px; }

    /* from design system .calendar-day */
    .cal-day {
      aspect-ratio: 1/1; border-radius: 18px;
      background: rgba(255,255,255,0.38);
      border: 1px solid rgba(255,255,255,0.55);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 4px; cursor: pointer; position: relative;
      transition: transform 0.18s, box-shadow 0.18s, background 0.18s;
      min-height: 52px; padding: 6px 4px; user-select: none;
    }
    .cal-day:hover:not(.past):not(.other-month):not(.full) {
      transform: translateY(-2px);
      background: rgba(255,255,255,0.72);
      box-shadow: 0 8px 22px rgba(14,41,85,0.10);
      z-index: 2;
    }
    .cal-day.other-month { opacity: 0.28; cursor: default; pointer-events: none; }
    .cal-day.past        { opacity: 0.34; cursor: default; pointer-events: none; }

    /* availability colours — brand palette */
    .cal-day.avail   { background: var(--color-avail-bg);   border-color: var(--color-avail-border); }
    .cal-day.partial { background: var(--color-partial-bg); border-color: var(--color-partial-border); }
    .cal-day.full    {
      background: var(--color-full-bg); border-color: var(--color-full-border);
      cursor: not-allowed;
    }
    .cal-day.full:hover { transform: none; box-shadow: none; }

    .cal-day.today        { border: 2px solid rgba(14,41,85,0.30); }
    .cal-day.today .d-num { color: var(--color-primary); font-weight: 800; }

    /* selected — from design system .active-day */
    .cal-day.selected {
      background: linear-gradient(145deg, var(--color-primary), #244980) !important;
      border-color: transparent !important;
      box-shadow: 0 16px 30px rgba(14,41,85,0.24) !important;
      transform: translateY(-2px) !important;
      color: white;
    }
    .cal-day.selected .d-num   { color: white !important; font-weight: 800; }
    .cal-day.selected .d-dots span { background: rgba(255,255,255,0.35) !important; }
    .cal-day.selected .d-slots { color: rgba(255,255,255,0.70) !important; }

    .d-num   { font-size: 13px; font-weight: 700; color: var(--color-text-main); line-height: 1; }
    .d-dots  { display: flex; gap: 2px; align-items: center; }
    .d-dots span { width: 5px; height: 5px; border-radius: 50%; }
    .d-slots { font-size: 9px; font-weight: 700; color: var(--color-text-subtle); }

    /* ══ STEP 2 — TIME ══ */
    .section-label {
      font-size: 10px; font-weight: 800; text-transform: uppercase;
      letter-spacing: 0.07em; color: var(--color-text-muted); margin-bottom: 10px;
    }

    /* duration row — from design system filter-bar / pill style */
    .duration-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 22px; }

    .dur-pill {
      height: 34px; padding: 0 15px; border-radius: var(--radius-pill);
      background: rgba(255,255,255,0.38); border: 1px solid var(--color-border);
      font-size: 12px; font-weight: 600; cursor: pointer; color: var(--color-text-main);
      box-shadow: var(--shadow-inset); transition: background 0.13s, border-color 0.13s;
    }
    .dur-pill:hover { background: rgba(255,255,255,0.72); border-color: var(--color-border-strong); }
    .dur-pill.active {
      background: var(--color-primary); color: white;
      border-color: transparent; box-shadow: 0 6px 16px rgba(14,41,85,0.18);
    }

    /* time slots grid — from design system metric-card style cells */
    .slots-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(90px,1fr)); gap: 8px;
    }
    .t-slot {
      height: 52px; border-radius: var(--radius-sm);
      border: 1px solid var(--color-border);
      background: rgba(255,255,255,0.48);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 3px; cursor: pointer; box-shadow: var(--shadow-inset);
      transition: transform 0.15s, box-shadow 0.15s, background 0.15s;
    }
    .t-slot:hover:not(.taken) {
      transform: translateY(-2px); background: rgba(255,255,255,0.88);
      box-shadow: 0 8px 20px rgba(14,41,85,0.10);
    }
    .t-time  { font-size: 13px; font-weight: 700; color: var(--color-text-main); }
    .t-label { font-size: 9px; font-weight: 700; color: var(--color-text-subtle); }

    /* taken — uses accent-mint (full day colour) */
    .t-slot.taken {
      background: var(--color-full-bg); border-color: var(--color-full-border);
      cursor: not-allowed; opacity: 0.60;
    }
    .t-slot.taken .t-time { color: var(--color-text-subtle); }

    /* selected slot — primary gradient, from design system .active-day */
    .t-slot.chosen {
      background: linear-gradient(145deg, var(--color-primary), #244980);
      border-color: transparent; box-shadow: 0 10px 24px rgba(14,41,85,0.20);
      transform: translateY(-2px);
    }
    .t-slot.chosen .t-time  { color: white; }
    .t-slot.chosen .t-label { color: rgba(255,255,255,0.65); }

    /* ══════════════════════════════════════════
       FOOTER — nav + summary
    ══════════════════════════════════════════ */
    .step-footer {
      padding: 14px 26px 22px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      border-top: 1px solid var(--color-border); flex-wrap: wrap;
    }

    /* ── Back button — design system .page-item + nav style ── */
    .btn-back {
      display: inline-flex; align-items: center; gap: 9px;
      height: 40px; padding: 0 18px; border-radius: var(--radius-pill);
      background: rgba(255,255,255,0.38); border: 1px solid var(--color-border);
      font-size: 13px; font-weight: 600; cursor: pointer; color: var(--color-text-muted);
      box-shadow: var(--shadow-inset); transition: background 0.15s, color 0.15s;
    }
    .btn-back:hover:not(:disabled) {
      background: rgba(255,255,255,0.78); color: var(--color-text-main);
    }
    .btn-back:disabled { opacity: 0.30; cursor: default; pointer-events: none; }
    .btn-back-icon {
      width: 22px; height: 22px; border-radius: 50%;
      background: rgba(14,41,85,0.08); display: grid; place-items: center;
      font-size: 13px; transition: background 0.15s;
    }
    .btn-back:hover:not(:disabled) .btn-back-icon { background: rgba(14,41,85,0.14); }

    /* summary chips */
    .summary-strip { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .s-chip {
      height: 28px; padding: 0 10px 0 12px; border-radius: var(--radius-pill);
      background: var(--color-primary-soft); border: 1px solid rgba(14,41,85,0.12);
      font-size: 11px; font-weight: 700; color: var(--color-primary);
      display: inline-flex; align-items: center; gap: 5px;
    }
    .chip-x {
      width: 14px; height: 14px; border-radius: 50%;
      background: rgba(14,41,85,0.12); border: none; cursor: pointer;
      display: grid; place-items: center; font-size: 10px; color: var(--color-primary);
      transition: background 0.12s;
    }
    .chip-x:hover { background: rgba(14,41,85,0.24); }

    /* confirm button — design system .role-button / .btn-add-primary */
    .btn-confirm {
      display: none; align-items: center; gap: 8px;
      height: 40px; padding: 0 22px; border-radius: var(--radius-pill);
      background: var(--color-primary); border: none;
      font-size: 13px; font-weight: 700; cursor: pointer; color: white;
      box-shadow: 0 10px 22px rgba(14,41,85,0.18);
      transition: background 0.15s, transform 0.12s;
    }
    .btn-confirm.visible { display: inline-flex; }
    .btn-confirm:hover { background: var(--color-primary-hover); transform: translateY(-1px); }
    .btn-confirm-icon {
      width: 20px; height: 20px; border-radius: 50%;
      background: rgba(255,255,255,0.18); display: grid; place-items: center; font-size: 11px;
    }

    /* ── Toast (design system chip-pulse style notification) ── */
    .toast {
      position: fixed; bottom: 28px; left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--color-primary); color: white;
      padding: 13px 24px; border-radius: var(--radius-pill);
      font-size: 13px; font-weight: 600; white-space: nowrap;
      box-shadow: 0 18px 40px rgba(14,41,85,0.26);
      transition: transform 0.36s cubic-bezier(0.34,1.56,0.64,1), opacity 0.3s;
      opacity: 0; z-index: 9999;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    /* ── Responsive ── */
    @media (max-width: 640px) {
      body          { padding: 14px 10px; }
      .steps-header { padding: 16px 16px 0; }
      .step-panel   { padding: 16px 16px 20px; }
      .step-footer  { padding: 12px 16px 18px; }
      .widget-title { font-size: 18px; }
      .legend       { display: none; }
      .step-label   { font-size: 9px; }
      .step-item:not(:last-child)::after { top: 15px; }
      .cal-day      { min-height: 38px; border-radius: 10px; padding: 4px 2px; gap: 2px; }
      .d-num        { font-size: 11px; }
      .d-dots span  { width: 3px; height: 3px; }
      .d-slots      { display: none; }
      .slots-grid   { grid-template-columns: repeat(auto-fill, minmax(74px,1fr)); }
    }
    @media (max-width: 380px) {
      .step-label { display: none; }
    }
  </style>
</head>
<body>

<div class="booking-widget" id="bookingWidget">

  <!-- ══ STEPS HEADER ══ -->
  <div class="steps-header">
    <div class="title-row">
      <div>
        <div class="widget-title">Book an Appointment</div>
        <div class="widget-subtitle">Select a date and your preferred time slot</div>
      </div>
      <div class="legend">
        <div class="legend-item"><span class="legend-dot avail"></span>Available</div>
        <div class="legend-item"><span class="legend-dot partial"></span>Limited</div>
        <div class="legend-item"><span class="legend-dot full"></span>Full</div>
      </div>
    </div>

    <div class="steps-track">
      <div class="step-item active" data-step="1" id="tab1">
        <div class="step-circle" id="circ1">1</div>
        <div class="step-label">Select Date</div>
      </div>
      <div class="step-item" data-step="2" id="tab2">
        <div class="step-circle" id="circ2">2</div>
        <div class="step-label">Choose Time</div>
      </div>
    </div>
  </div>

  <!-- ══ STEP PANELS ══ -->
  <div class="step-panels">

    <!-- STEP 1 -->
    <div class="step-panel active" id="panel1">
      <div class="panel-head">
        <div>
          <div class="panel-heading">Pick a Date</div>
          <div class="panel-sub">Tap any available day to continue</div>
        </div>
        <div class="month-controls">
          <button class="calendar-nav" id="prevMonth">&#8249;</button>
          <button class="pill-btn" id="todayBtn">Today</button>
          <button class="calendar-nav" id="nextMonth">&#8250;</button>
        </div>
      </div>

      <div class="month-row">
        <div class="month-label" id="monthLabel"></div>
      </div>

      <div class="day-names">
        <div class="day-name">Sun</div><div class="day-name">Mon</div>
        <div class="day-name">Tue</div><div class="day-name">Wed</div>
        <div class="day-name">Thu</div><div class="day-name">Fri</div>
        <div class="day-name">Sat</div>
      </div>
      <div class="cal-grid" id="calGrid"></div>
    </div>

    <!-- STEP 2 -->
    <div class="step-panel" id="panel2">
      <div class="panel-head">
        <div>
          <div class="panel-heading" id="step2Heading">Choose a Time</div>
          <div class="panel-sub">Select your session length, then pick an open slot</div>
        </div>
      </div>

      <div class="section-label">Session Duration</div>
      <div class="duration-row">
        <button class="dur-pill active" data-min="30">30 min</button>
        <button class="dur-pill" data-min="45">45 min</button>
        <button class="dur-pill" data-min="60">1 hr</button>
        <button class="dur-pill" data-min="90">1.5 hr</button>
        <button class="dur-pill" data-min="120">2 hr</button>
      </div>

      <div class="section-label">Available Slots</div>
      <div class="slots-grid" id="slotsGrid"></div>
    </div>

  </div>

  <!-- ══ FOOTER ══ -->
  <div class="step-footer">
    <!-- back button — design-system styled -->
    <button class="btn-back" id="btnBack" disabled>
      <span class="btn-back-icon">&#8592;</span>
      Back
    </button>

    <div class="summary-strip" id="summaryStrip"></div>

    <button class="btn-confirm" id="btnConfirm">
      <span class="btn-confirm-icon">✓</span>
      Confirm Booking
    </button>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
  /* ─── Constants ─── */
  const MONTHS  = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const DAYS_S  = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const MONS_S  = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  const BASE_SLOTS = [
    '08:00','08:30','09:00','09:30','10:00','10:30',
    '11:00','11:30','12:00','13:00','13:30','14:00',
    '14:30','15:00','15:30','16:00','16:30','17:00'
  ];

  /* ─── State ─── */
  const today = new Date(); today.setHours(0,0,0,0);
  let viewYear    = today.getFullYear();
  let viewMonth   = today.getMonth();
  let currentStep = 1;
  let selectedDate     = null;
  let selectedHour     = null;
  let selectedDuration = 30;

  /* ─── Pseudo-random helpers ─── */
  function hash(n) { return ((n * 1103515245 + 12345) & 0x7fffffff); }

  function getDayStatus(d) {
    if (d < today) return 'past';
    const r = hash(d.getDate() * 7 + d.getMonth() * 31) % 10;
    if (r < 5) return 'avail';
    if (r < 8) return 'partial';
    return 'full';
  }

  function getSlotCount(d) {
    return hash((d.getDate() + 3) * 11 + d.getMonth() * 17) % 10 + 2;
  }

  function getSlotsForDate(d) {
    return BASE_SLOTS.map((t, i) => {
      const r = hash(d.getDate() * (i + 3) + d.getMonth() * 7 + i * 13) % 10;
      return { time: t, taken: r < 3 };
    });
  }

  /* ─── Calendar ─── */
  function buildCalendar() {
    const grid = document.getElementById('calGrid');
    grid.innerHTML = '';
    document.getElementById('monthLabel').textContent = `${MONTHS[viewMonth]} ${viewYear}`;

    const firstDay    = new Date(viewYear, viewMonth, 1).getDay();
    const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
    const prevDays    = new Date(viewYear, viewMonth, 0).getDate();

    for (let i = 0; i < firstDay; i++)
      grid.appendChild(makeCell(new Date(viewYear, viewMonth - 1, prevDays - firstDay + i + 1), true));

    for (let d = 1; d <= daysInMonth; d++)
      grid.appendChild(makeCell(new Date(viewYear, viewMonth, d), false));

    const trail = (firstDay + daysInMonth) % 7;
    if (trail) for (let d = 1; d <= 7 - trail; d++)
      grid.appendChild(makeCell(new Date(viewYear, viewMonth + 1, d), true));
  }

  function makeCell(date, other) {
    const cell = document.createElement('div');
    cell.className = 'cal-day';

    if (other) {
      cell.classList.add('other-month');
      const n = document.createElement('div'); n.className = 'd-num';
      n.textContent = date.getDate(); cell.appendChild(n);
      return cell;
    }

    const status = getDayStatus(date);
    if (status === 'past') {
      cell.classList.add('past');
    } else {
      cell.classList.add(status);
      if (date.getTime() === today.getTime()) cell.classList.add('today');
      if (selectedDate && date.getTime() === selectedDate.getTime()) cell.classList.add('selected');
    }

    const num = document.createElement('div'); num.className = 'd-num';
    num.textContent = date.getDate(); cell.appendChild(num);

    if (status !== 'past' && status !== 'full') {
      // dots
      const dots = document.createElement('div'); dots.className = 'd-dots';
      for (let i = 0; i < 3; i++) {
        const dot = document.createElement('span');
        dot.style.background = status === 'avail'
          ? 'var(--color-avail-dot)'
          : i < 2 ? 'var(--color-partial-dot)' : 'var(--color-full-dot)';
        dots.appendChild(dot);
      }
      cell.appendChild(dots);

      // slot count
      const slots = document.createElement('div'); slots.className = 'd-slots';
      slots.textContent = `${getSlotCount(date)} slots`; cell.appendChild(slots);

      cell.addEventListener('click', () => pickDate(date, cell));
    }

    return cell;
  }

  /* ─── Pick Date → auto-advance ─── */
  function pickDate(date, cellEl) {
    document.querySelectorAll('.cal-day.selected').forEach(c => c.classList.remove('selected'));
    cellEl.classList.add('selected');
    selectedDate = date;
    selectedHour = null;

    document.getElementById('step2Heading').textContent =
      `Times for ${DAYS_S[date.getDay()]}, ${date.getDate()} ${MONS_S[date.getMonth()]} ${date.getFullYear()}`;

    // short delay so the selection animation is visible, then advance
    setTimeout(() => goToStep(2), 220);
  }

  /* ─── Time Slots ─── */
  function buildSlots() {
    const grid = document.getElementById('slotsGrid');
    grid.innerHTML = '';
    if (!selectedDate) return;

    getSlotsForDate(selectedDate).forEach(s => {
      const el = document.createElement('div');
      el.className = 't-slot' + (s.taken ? ' taken' : '');

      if (!s.taken && selectedHour !== null && parseInt(s.time) === selectedHour)
        el.classList.add('chosen');

      const t = document.createElement('div'); t.className = 't-time'; t.textContent = s.time;
      const a = document.createElement('div'); a.className = 't-label'; a.textContent = s.taken ? 'Booked' : 'Open';
      el.append(t, a);

      if (!s.taken) el.addEventListener('click', () => pickSlot(s.time, el));
      grid.appendChild(el);
    });
  }

  function pickSlot(timeStr, slotEl) {
    document.querySelectorAll('.t-slot.chosen').forEach(s => s.classList.remove('chosen'));
    slotEl.classList.add('chosen');
    selectedHour = parseInt(timeStr.split(':')[0]);
    syncFooter();
  }

  /* ─── Step control ─── */
  function goToStep(n) {
    if (n === 2 && !selectedDate) return;

    currentStep = n;

    document.querySelectorAll('.step-panel').forEach((p, i) =>
      p.classList.toggle('active', i + 1 === n));

    // Update tabs
    document.querySelectorAll('.step-item').forEach((tab, i) => {
      const s = i + 1;
      tab.classList.remove('active', 'done');
      const circ = document.getElementById(`circ${s}`);
      if (s === n) {
        tab.classList.add('active');
        circ.textContent = s;
      } else if (s < n) {
        tab.classList.add('done');
        circ.textContent = '✓';
      } else {
        circ.textContent = s;
      }
    });

    if (n === 2) buildSlots();
    syncFooter();

    document.getElementById('bookingWidget').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  /* ─── Footer ─── */
  function syncFooter() {
    const btnBack    = document.getElementById('btnBack');
    const btnConfirm = document.getElementById('btnConfirm');
    const strip      = document.getElementById('summaryStrip');

    btnBack.disabled = currentStep === 1;
    btnConfirm.classList.toggle('visible', currentStep === 2 && selectedHour !== null);

    // Summary chips
    strip.innerHTML = '';
    if (selectedDate) {
      strip.appendChild(makeChip(
        `📅 ${DAYS_S[selectedDate.getDay()]} ${selectedDate.getDate()} ${MONS_S[selectedDate.getMonth()]}`,
        () => { selectedDate = null; selectedHour = null; buildCalendar(); goToStep(1); }
      ));
    }
    if (selectedHour !== null) {
      strip.appendChild(makeChip(
        `🕐 ${pad(selectedHour)}:00 · ${selectedDuration} min`,
        () => { selectedHour = null; buildSlots(); syncFooter(); }
      ));
    }
  }

  function makeChip(text, onRemove) {
    const tag = document.createElement('div'); tag.className = 's-chip';
    const span = document.createElement('span'); span.textContent = text;
    const x = document.createElement('button'); x.className = 'chip-x'; x.textContent = '×';
    x.addEventListener('click', e => { e.stopPropagation(); onRemove(); });
    tag.append(span, x); return tag;
  }

  /* ─── Wiring ─── */
  document.getElementById('btnBack').addEventListener('click', () => goToStep(currentStep - 1));

  document.getElementById('prevMonth').addEventListener('click', () => {
    viewMonth--; if (viewMonth < 0) { viewMonth = 11; viewYear--; } buildCalendar();
  });
  document.getElementById('nextMonth').addEventListener('click', () => {
    viewMonth++; if (viewMonth > 11) { viewMonth = 0; viewYear++; } buildCalendar();
  });
  document.getElementById('todayBtn').addEventListener('click', () => {
    viewYear = today.getFullYear(); viewMonth = today.getMonth(); buildCalendar();
  });

  document.querySelectorAll('.dur-pill').forEach(btn =>
    btn.addEventListener('click', () => {
      document.querySelectorAll('.dur-pill').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectedDuration = +btn.dataset.min;
      syncFooter();
    })
  );

  // Clickable done tabs
  document.querySelectorAll('.step-item').forEach(tab =>
    tab.addEventListener('click', () => {
      if (tab.classList.contains('done') || tab.classList.contains('active'))
        goToStep(+tab.dataset.step);
    })
  );

  document.getElementById('btnConfirm').addEventListener('click', () => {
    const d = selectedDate;
    const msg = `✓ Booked — ${DAYS_S[d.getDay()]} ${d.getDate()} ${MONS_S[d.getMonth()]} at ${pad(selectedHour)}:00 (${selectedDuration} min)`;
    const toast = document.getElementById('toast');
    toast.textContent = msg; toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 4000);
  });

  function pad(n) { return String(n).padStart(2, '0'); }

  /* ─── Init ─── */
  buildCalendar();
  syncFooter();
</script>
</body>
</html>
