<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Create Appointment Design QA</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      background: #e8edf3;
      color: #22314a;
      font: 600 18px/1.4 Arial, sans-serif;
    }
    main {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }
    figure {
      margin: 0;
      padding: 16px;
      border-radius: 16px;
      background: #fff;
    }
    figcaption { margin-bottom: 12px; }
    .crop {
      position: relative;
      width: 100%;
      aspect-ratio: 1390 / 973;
      overflow: hidden;
      border: 1px solid #d9e0e8;
    }
    img {
      display: block;
      max-width: none;
    }
    .source img {
      position: absolute;
      top: -2.36%;
      left: -5.53%;
      width: 109.35%;
    }
    .implementation img {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <main>
    <figure>
      <figcaption>Source reference</figcaption>
      <div class="crop source"><img src="create-appointment-source.png" alt="Source Create Appointment modal"></div>
    </figure>
    <figure>
      <figcaption>Browser implementation</figcaption>
      <div class="crop implementation"><img src="create-appointment-reference-1522.png" alt="Implemented Create Appointment modal"></div>
    </figure>
  </main>
</body>
</html>
